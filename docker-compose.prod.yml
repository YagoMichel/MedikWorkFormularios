name: mediwork2

services:
  db:
    image: postgres:16-alpine
    container_name: mediwork2-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: mediwork
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: mediwork
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mediwork"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: mediwork2-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env.prod
    environment:
      DATABASE_URL: postgresql://mediwork:${DB_PASS}@db:5432/mediwork?schema=public
      PORT: 4000
      UPLOAD_DIR: /app/uploads
    volumes:
      - uploads:/app/uploads

  nginx:
    build:
      context: .
      dockerfile: Dockerfile.nginx
      # Variables VITE_* del frontend (se hornean al construir). Vienen del .env.prod.
      args:
        VITE_TURNSTILE_SITE_KEY: ${VITE_TURNSTILE_SITE_KEY:-}
        VITE_INACTIVITY_MIN: ${VITE_INACTIVITY_MIN:-}
    container_name: mediwork2-nginx
    restart: unless-stopped
    depends_on:
      - backend
    # Único puerto publicado al host. El backend y la BD NO publican puerto (red interna).
    #  - Detrás de un reverse proxy del host (Caddy/HTTPS):  WEB_HOST=127.0.0.1 (privado)
    #  - Acceso directo por IP:puerto (sin dominio/HTTPS):    WEB_HOST=0.0.0.0  (público)
    # WEB_PORT elige un puerto libre para no chocar con otras apps del servidor.
    ports:
      - "${WEB_HOST:-127.0.0.1}:${WEB_PORT:-7000}:80"

volumes:
  pgdata:
  uploads:
