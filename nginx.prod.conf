server {
  listen 80;
  client_max_body_size 20m;

  root /usr/share/nginx/html;
  index index.html;

  # No revelar la versión de nginx en las respuestas (Server: header).
  server_tokens off;

  # Límite de tamaño de los headers de la petición: frena intentos de saturar
  # memoria con encabezados enormes (una vía de abuso vía HTTP headers).
  large_client_header_buffers 4 16k;

  location /api/ {
    proxy_pass http://backend:4000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # El backend NO debe confiar en un Forwarded/X-Forwarded-Host que mande el
    # cliente (defensa ante Host/header injection en la generación de enlaces).
    proxy_set_header Forwarded "";
    proxy_set_header X-Forwarded-Host "";
  }

  location /uploads/ {
    proxy_pass http://backend:4000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location /socket.io/ {
    proxy_pass http://backend:4000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
  }

  location / {
    try_files $uri $uri/ /index.html;

    # ---- Encabezados de seguridad para el navegador (app HTML/JS) ----
    # helmet ya cubre /api; esto protege el frontend que sirve nginx.
    # 'always' = enviarlos incluso en respuestas de error (404, etc.).

    # Anti-clickjacking: la app no puede embeberse en un <iframe> de otro sitio.
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    # No adivinar el tipo MIME (frena ataques de content-sniffing).
    add_header X-Content-Type-Options "nosniff" always;
    # No filtrar la URL completa como referrer a terceros.
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Desactivar APIs sensibles del navegador que la app no usa.
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(self), payment=()" always;
    # HSTS: forzar HTTPS por 6 meses (solo surte efecto servido sobre TLS —
    # el terminador TLS que está frente a este nginx debe usar https).
    add_header Strict-Transport-Security "max-age=15768000; includeSubDomains" always;

    # Política de contenido: solo se permite cargar recursos de orígenes
    # conocidos. Ajustada a lo que usa la app:
    #   - Fuentes: Google Fonts (googleapis + gstatic)
    #   - Captcha: Cloudflare Turnstile (challenges.cloudflare.com)
    #   - 'unsafe-inline' en script: el pequeño script de tema en index.html.
    #   - 'unsafe-inline' en style: clases utilitarias de Tailwind.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self' https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
  }
}
