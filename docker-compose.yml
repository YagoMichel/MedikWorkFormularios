name: mediwork

services:
  db:
    image: postgres:16-alpine
    container_name: mediwork-db
    environment:
      POSTGRES_USER: mediwork
      POSTGRES_PASSWORD: mediwork
      POSTGRES_DB: mediwork
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mediwork"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: mediwork-backend
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://mediwork:mediwork@db:5432/mediwork?schema=public
      JWT_SECRET: ${JWT_SECRET:-change-me-in-prod}
      # ANTHROPIC_API_KEY y GOOGLE_API_KEY vienen del env_file
      PORT: 4000
      UPLOAD_DIR: /app/uploads
      DEFAULT_DAILY_CAPACITY: ${DEFAULT_DAILY_CAPACITY:-20}
      CLINIC_NAME: ${CLINIC_NAME:-Clinica Visual}
      CLINIC_ADDRESS: ${CLINIC_ADDRESS:-}
      CLINIC_PHONE: ${CLINIC_PHONE:-}
      CLINIC_HOURS_WEEKDAY: ${CLINIC_HOURS_WEEKDAY:-09:00-18:00}
      CLINIC_HOURS_SATURDAY: ${CLINIC_HOURS_SATURDAY:-09:00-14:00}
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN:-cambia-esto-por-secreto}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      SELF_URL: http://localhost:4000
    volumes:
      - ./backend/src:/app/src
      - uploads:/app/uploads
    ports:
      - "4000:4000"

  frontend:
    build: ./frontend
    container_name: mediwork-frontend
    depends_on:
      - backend
    ports:
      - "5173:5173"
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    volumes:
      - ./frontend:/app
      - /app/node_modules

  nginx:
    image: nginx:alpine
    container_name: mediwork-nginx
    depends_on:
      - frontend
      - backend
    ports:
      - "3000:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  pgdata:
  uploads:
