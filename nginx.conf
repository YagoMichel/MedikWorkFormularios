server {
  listen 80;
  client_max_body_size 20m;

  location /api/ {
    proxy_pass http://backend:4000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # IP real del cliente — el backend la usa para los límites anti-fuerza-bruta
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location /uploads/ {
    proxy_pass http://backend:4000;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # Proxy a IcaliaLabs SEPOMEX — datos reales, server-to-server sin CORS
  location /cp-proxy/ {
    proxy_pass https://sepomex.icalialabs.com/api/v1/;
    proxy_ssl_server_name on;
    proxy_set_header Host sepomex.icalialabs.com;
    proxy_set_header Accept "application/json";
    proxy_set_header X-Real-IP "";
    proxy_set_header X-Forwarded-For "";
  }

  location / {
    proxy_pass http://frontend:5173;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
  }
}
