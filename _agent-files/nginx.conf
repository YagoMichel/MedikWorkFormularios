# nginx.conf
# Reverse proxy unificado en puerto 80 (mapeado a host:8080)
# Routea:
#   /api/*      -> backend (Express)
#   /webhook/*  -> n8n (necesario para que Meta llegue al workflow)
#   /uploads/*  -> backend (archivos)
#   /n8n/       -> UI de n8n (opcional, tambien expuesta directo en :5678)
#   resto       -> frontend (Vite dev server)

server {
  listen 80;
  client_max_body_size 20m;

  location /api/ {
    proxy_pass http://backend:4000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location /uploads/ {
    proxy_pass http://backend:4000;
  }

  # Webhook de WhatsApp -> n8n
  location /webhook/ {
    proxy_pass http://n8n:5678;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }

  # Test webhook (n8n usa /webhook-test/ para ejecuciones manuales)
  location /webhook-test/ {
    proxy_pass http://n8n:5678;
    proxy_http_version 1.1;
  }

  location / {
    proxy_pass http://frontend:5173;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
  }
}
