name: mediwork

services:
  db:
    image: postgres:16-alpine
    container_name: mediwork-db
    environment:
      POSTGRES_USER: mediwork
      POSTGRES_PASSWORD: mediwork
      POSTGRES_DB: mediwork
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mediwork"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: mediwork-backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://mediwork:mediwork@db:5432/mediwork?schema=public
      JWT_SECRET: ${JWT_SECRET:-change-me-in-prod}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      PORT: 4000
      UPLOAD_DIR: /app/uploads
      DEFAULT_DAILY_CAPACITY: ${DEFAULT_DAILY_CAPACITY:-20}
      CLINIC_NAME: ${CLINIC_NAME:-Clinica Visual}
      CLINIC_ADDRESS: ${CLINIC_ADDRESS:-}
      CLINIC_PHONE: ${CLINIC_PHONE:-}
      CLINIC_HOURS_WEEKDAY: ${CLINIC_HOURS_WEEKDAY:-09:00-18:00}
      CLINIC_HOURS_SATURDAY: ${CLINIC_HOURS_SATURDAY:-09:00-14:00}
    volumes:
      - uploads:/app/uploads
    ports:
      - "4000:4000"

  frontend:
    build: ./frontend
    container_name: mediwork-frontend
    depends_on:
      - backend
    ports:
      - "5173:5173"
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    volumes:
      - ./frontend:/app
      - /app/node_modules

  # ===================================================
  # n8n: orquestador del agente
  # ===================================================
  # Acceso UI: http://localhost:5678
  # Webhook publico (via nginx): http://TU_DOMINIO/webhook/whatsapp
  # ===================================================
  n8n:
    image: n8nio/n8n:1.70.0
    container_name: mediwork-n8n
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_started
    environment:
      # Auth UI
      N8N_BASIC_AUTH_ACTIVE: "true"
      N8N_BASIC_AUTH_USER: ${N8N_USER:-admin}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_PASSWORD:-changeme}
      # Persistencia (n8n usa la misma Postgres pero schema separado)
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: db
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: mediwork
      DB_POSTGRESDB_SCHEMA: n8n
      DB_POSTGRESDB_USER: mediwork
      DB_POSTGRESDB_PASSWORD: mediwork
      # URL publica donde Meta envia webhooks. Para desarrollo usa ngrok.
      WEBHOOK_URL: ${N8N_WEBHOOK_URL:-http://localhost:5678/}
      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_PORT: 5678
      N8N_PROTOCOL: ${N8N_PROTOCOL:-http}
      # Zona horaria
      GENERIC_TIMEZONE: ${TZ:-America/Mexico_City}
      TZ: ${TZ:-America/Mexico_City}
      # Permitir credenciales/tools externos (claves API, etc.)
      N8N_DIAGNOSTICS_ENABLED: "false"
    volumes:
      - n8n_data:/home/node/.n8n
    ports:
      - "5678:5678"

  nginx:
    image: nginx:alpine
    container_name: mediwork-nginx
    depends_on:
      - frontend
      - backend
      - n8n
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  pgdata:
  uploads:
  n8n_data:
